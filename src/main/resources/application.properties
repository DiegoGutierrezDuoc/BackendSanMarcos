spring.application.name=sanmarcos

# Conexión a MySQL (usa variables de entorno si existen, con valor local por defecto)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/veterinaria_sanmarcos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate (Flyway se encargará de crear las tablas)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Clave JWT desde variable de entorno
jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-en-entorno-seguro}

# Personalización visual de Swagger UI
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.docExpansion=list
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.persistAuthorization=true